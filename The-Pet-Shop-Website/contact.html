    <!--NAVBAR-->

            <li><a href="index.html">HOME</a></li>

        </ul>
    </nav>

    <div>
        <h1>Contact Us!</h1>
    </div>
</header>

<!--MAIN-->
<main>
    <!--FORM-->
    <section>
        <div>
            <h3 id="contact-h3">
                Please provide your contact information and a brief message of your inquiry.
            </h3>
            <div>
                <form>
                    <input type="text" value="" placeholder="First Name">
                    <input type="text" value="" placeholder="Last Name">
                    <br>
                    <input type="email" value="" placeholder="Email">
                    <br>
                    <input type="tel" value="" placeholder="Phone Number">
                    <br>
                    <input type="checkbox" id="Newsletter">
                    <label for="Newsletter">
                        Would you like to receive our monthly newsletter?
                    </label>
                    <br>
                    <textarea>Type message here...</textarea>
                    <br>
                    <input type="submit" value="Submit">
                </form>
            </div>
        </div>
    </section>
</main>
